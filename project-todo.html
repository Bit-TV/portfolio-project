<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock Project - Project Details</title>
  <link rel="stylesheet" href="styles.css" />

  <style>
    #clock {
      height: 200px;
      width: 200px;
      border: 5px solid black;
      border-radius: 100%;
      position: relative;
      margin: 2rem auto;
    }

    .hand {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: top;
    }

    #hrs {
      width: 3px;
      height: 40px;
      background-color: red;
    }

    #mnt {
      width: 2px;
      height: 50px;
      background-color: blue;
    }

    #scd {
      width: 1px;
      height: 60px;
      background-color: rgb(21, 255, 0);
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul class="navbar">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#skills">Skills</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="section">
    <h1 style="text-align:center;">Clock Project</h1>

    <div id="clock">
      <div class="hand" id="hrs"></div>
      <div class="hand" id="mnt"></div>
      <div class="hand" id="scd"></div>
    </div>

    <p style="text-align:center;">This clock displays real-time updates of the hour, minute, and second hands using JavaScript and CSS transforms.</p>

    <a href="index.html#projects" class="button" style="display: block; text-align: center; margin-top: 2rem;">Back to Projects</a>
  </main>

  <footer>
    <p>&copy; 2025 Briyana Verdugo. All rights reserved.</p>
  </footer>

  <script>
    function handle_clock() {
      const date = new Date();
      const hr = date.getHours() % 12;
      const min = date.getMinutes();
      const secd = date.getSeconds();

      const hr_deg = 180 + (hr * 30 + min * 0.5);
      const min_deg = 180 + (min * 6 + secd * 0.1);
      const sec_deg = 180 + (secd * 6);

      document.getElementById("scd").style.transform = `rotate(${sec_deg}deg)`;
      document.getElementById("mnt").style.transform = `rotate(${min_deg}deg)`;
      document.getElementById("hrs").style.transform = `rotate(${hr_deg}deg)`;
    }

    setInterval(handle_clock, 1000);
  </script>
</body>
</html>
